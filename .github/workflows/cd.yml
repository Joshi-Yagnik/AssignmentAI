# ─────────────────────────────────────────────────────────────────────────────
# CD — Continuous Deployment
# Runs only when CI passes on the main branch.
# Frontend  → Vercel  (via Vercel CLI)
# Backend   → Render  (via deploy hook URL stored in GitHub Secret)
# ─────────────────────────────────────────────────────────────────────────────
name: CD

on:
  workflow_run:
    workflows: [CI]           # only trigger after CI succeeds
    types: [completed]
    branches: [main]

jobs:
  # ── Guard: only deploy when CI passed ───────────────────────────────────────
  check-ci:
    name: Guard — CI must have passed
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "CI passed — proceeding to deploy"

  # ── Deploy Frontend to Vercel ────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: check-ci

    defaults:
      run:
        working-directory: assignmentai-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: assignmentai-frontend/package-lock.json

      - name: Resolve Vercel Project IDs
        id: resolve-ids
        run: |
          echo "Fetching project info for 'assignment-ai'..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" "https://api.vercel.com/v9/projects/assignment-ai")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Failed to fetch Vercel project. HTTP $HTTP_CODE"
            echo "Body: $BODY"
            exit 1
          fi
          
          ORG_ID=$(echo "$BODY" | jq -r '.accountId')
          PROJ_ID=$(echo "$BODY" | jq -r '.id')
          
          echo "org_id=$ORG_ID" >> $GITHUB_OUTPUT
          echo "project_id=$PROJ_ID" >> $GITHUB_OUTPUT

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ steps.resolve-ids.outputs.org_id }}
          vercel-project-id: ${{ steps.resolve-ids.outputs.project_id }}
          vercel-args: '--prod --yes'
          working-directory: ${{ github.workspace }}

  # ── Deploy Backend to Render ─────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: check-ci

    steps:
      - name: Trigger Render deploy hook
        # Render provides a deploy hook URL in: Dashboard > Service > Settings > Deploy Hooks
        # Store it as RENDER_DEPLOY_HOOK_URL in GitHub Secrets.
        # -o writes the response body to a file; -w prints the HTTP code to stdout.
        # We capture stdout into HTTP_CODE — NOT tail of the file (which would be the body).
        run: |
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
            --request POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Response body:"
          cat response.json
          if [ "$HTTP_CODE" -ne 200 ] && [ "$HTTP_CODE" -ne 201 ] && [ "$HTTP_CODE" -ne 202 ]; then
            echo "Render deploy hook returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Backend deploy triggered successfully on Render"
